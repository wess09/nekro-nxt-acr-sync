name: Sync NekroNXT image to Aliyun ACR
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Copy official NekroNXT image to Shanghai ACR personal registry
        uses: zekza/sync-docker-image@v1
        with:
          source: ghcr.io
          source-credential: ${{ secrets.SOURCE_CREDENTIAL }}
          destination: crpi-gukwnnx8iuh9qpez.cn-shanghai.personal.cr.aliyuncs.com
          destination-credential: ${{ secrets.DESTINATION_CREDENTIAL }}
          copy: "nekroai/nekro-nxt:latest hajiming/nekro-nxt:latest"
