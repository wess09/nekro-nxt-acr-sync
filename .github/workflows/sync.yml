name: Sync NekroNXT image to Aliyun ACR

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set up image-syncer
        uses: docker://ghcr.io/actuated/image-syncer:latest
        with:
          args: --help
